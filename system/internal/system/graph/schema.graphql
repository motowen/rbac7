# System GraphQL API

"""
Auth directive for permission checking.
If namespace is required, the resolver must provide it in context.
"""
directive @auth(
  """The required permission (e.g., platform.system.create)"""
  permission: String!
  """Whether namespace is required for permission check"""
  namespaceRequired: Boolean = false
  """Field path to extract namespace from (e.g., 'input.namespace' for nested input)"""
  namespaceField: String = "namespace"
) on FIELD_DEFINITION

# ============================================
# Custom Scalars
# ============================================

"""JSON scalar type for dynamic/flexible data structures (maps to MongoDB BSON Object)"""
scalar JSON

# ============================================
# System Types
# ============================================

type System {
  namespace: String!
  name: String!
  description: String
}

type SystemWithRole {
  namespace: String!
  name: String!
  description: String
  role: String!
}

input UpdateSystemInput {
  namespace: String!
  name: String
  description: String
}

# ============================================
# Shared Types
# ============================================

"""共用狀態 (適用於 Dashboard 和 LibraryWidget)"""
enum EntityStatus {
  DRAFT
  PUBLISHED
  CHANGED
  TRASHED
}

"""共用鎖定資訊"""
type EntityLock {
  entityType: String!
  entityId: String!
  lockedBy: String!
  lockedAt: String!
  expiresAt: String!
}

# ============================================
# Dashboard Types
# ============================================

"""Dashboard"""
type Dashboard {
  id: ID!
  name: String!
  description: String
  status: EntityStatus!
  """草稿版本的名稱 (changed 狀態時)"""
  draftName: String
  """草稿版本的描述 (changed 狀態時)"""
  draftDescription: String
  createdAt: String!
  updatedAt: String!
  createdBy: String!
  """是否被鎖定"""
  isLocked: Boolean!
  """鎖定者 (如有)"""
  lockedBy: String
}

"""Dashboard 歷史版本"""
type DashboardHistory {
  id: ID!
  dashboardId: String!
  version: Int!
  publishedAt: String!
  publishedBy: String!
}

"""Library Widget 歷史版本"""
type LibraryWidgetHistory {
  id: ID!
  widgetId: String!
  version: Int!
  publishedAt: String!
  publishedBy: String!
}

# ============================================
# Datasource Types
# ============================================

"""Datasource 資料來源配置"""
type Datasource {
  id: String!
  name: String!
  description: String
  type: String!
  """動態配置 (JSON 格式，對應 MongoDB BSON Object)"""
  config: JSON
}

input DatasourceInput {
  id: String!
  name: String!
  description: String
  type: String!
  config: JSON
}

# ============================================
# Widget Main Types
# ============================================

"""Library Widget - 組件庫中的 Widget 模板"""
type LibraryWidget {
  id: ID!
  name: String!
  version: String!
  type: String!
  typeVersion: String!
  """Widget Schema (JSON 格式，對應 MongoDB BSON Object)"""
  schema: JSON
  """Datasource 配置列表"""
  datasource: [Datasource!]
  status: EntityStatus!
  thumbnailUrl: String
  displayMode: String
  tags: [String!]
  createdAt: String!
  updatedAt: String!
  publishedAt: String
  """User Config (JSON 格式，對應 MongoDB BSON Object)"""
  userConfig: JSON
  """是否被鎖定"""
  isLocked: Boolean!
  """鎖定者 (如有)"""
  lockedBy: String
}

"""Dashboard Widget - Dashboard 中的 Widget 實例 (合併 LibraryWidget 欄位 + 自訂欄位)"""
type DashboardWidget {
  id: ID!
  dashboardId: String!
  """版本標識: published | draft"""
  version: String!
  
  # 從 LibraryWidget 複製的欄位
  libraryWidgetId: String!
  libraryWidgetVersion: String!
  type: String!
  typeVersion: String!
  name: String!
  datasource: [Datasource!]
  schema: JSON
  
  # Dashboard Widget 專屬欄位
  displayMode: String
  """配置覆蓋 (JSON 格式)"""
  configOverrides: JSON!
  """佈局 (JSON 格式)"""
  layout: JSON!
  """查詢覆蓋 (JSON 格式)"""
  queryOverrides: JSON
  """排序順序"""
  sortOrder: Int!
  
  createdAt: String!
  updatedAt: String!
}

# ============================================
# Library Widget Input Types
# ============================================

input CreateLibraryWidgetInput {
  name: String!
  version: String!
  type: String!
  typeVersion: String!
  schema: JSON
  datasource: [DatasourceInput!]
  thumbnailUrl: String
  displayMode: String
  tags: [String!]
  userConfig: JSON
}

input UpdateLibraryWidgetInput {
  id: ID!
  name: String
  version: String
  type: String
  typeVersion: String
  schema: JSON
  datasource: [DatasourceInput!]
  thumbnailUrl: String
  displayMode: String
  tags: [String!]
  userConfig: JSON
}

# ============================================
# Dashboard Input Types
# ============================================

input CreateDashboardInput {
  name: String!
  description: String
}

input UpdateDashboardInput {
  dashboardId: String!
  name: String
  description: String
}

input AddWidgetToDashboardInput {
  dashboardId: String!
  libraryWidgetId: String!
  libraryWidgetVersion: String!
  configOverrides: JSON!
  layout: JSON!
  displayMode: String
  queryOverrides: JSON
  sortOrder: Int
}

input UpdateDashboardWidgetInput {
  dashboardWidgetId: String!
  configOverrides: JSON
  layout: JSON
  displayMode: String
  queryOverrides: JSON
  sortOrder: Int
}

input RemoveDashboardWidgetInput {
  dashboardWidgetId: String!
}

# ============================================
# Query
# ============================================

type Query {
  """
  Get systems that the current user has access to, with their roles.
  No permission check needed - uses RBAC /user_roles/me internally.
  """
  systemMe: [SystemWithRole!]!
  
  """
  Get system detail by namespace.
  Requires platform.system.read permission on the namespace.
  """
  systemDetail(namespace: String!): System @auth(permission: "platform.system.read", namespaceRequired: true)

  # ----- Library Widget Queries -----
  
  """Get all library widgets (excludes trashed)"""
  libraryWidgets: [LibraryWidget!]!
  
  """Get a library widget by ID. Use viewDraft=true to see the changed version (for editors)."""
  libraryWidget(id: ID!, viewDraft: Boolean = false): LibraryWidget

  # ----- Dashboard Queries -----
  
  """Get all dashboards (excludes trashed)"""
  dashboards: [Dashboard!]!
  
  """Get a dashboard by ID"""
  dashboard(id: ID!): Dashboard
  
  """Get dashboard history (published versions)"""
  dashboardHistory(dashboardId: String!): [DashboardHistory!]!

  """Get library widget history (published versions)"""
  libraryWidgetHistory(widgetId: ID!): [LibraryWidgetHistory!]!

  # ----- Dashboard Widget Queries -----
  
  """Get dashboard widgets. Use viewDraft=true to see draft version (for editors)."""
  queryDashboardWidgets(dashboardId: String!, viewDraft: Boolean = false): [DashboardWidget!]!
  
  """Get a dashboard widget by ID"""
  queryDashboardWidget(dashboardWidgetId: String!): DashboardWidget
}

# ============================================
# Mutation
# ============================================

type Mutation {
  """
  Create a new system (requires platform.system.create permission - moderator only).
  Owner will be assigned via RBAC.
  """
  createSystem(namespace: String!, name: String!, description: String, owner: String!): System! @auth(permission: "platform.system.create")
  
  """
  Update system name and/or description.
  Requires platform.system.update permission on the namespace.
  """
  updateSystem(input: UpdateSystemInput!): System! @auth(permission: "platform.system.update", namespaceRequired: true, namespaceField: "input.namespace")

  # ----- Library Widget CRUD + State Machine -----
  
  """Create a new library widget (status: draft)"""
  createLibraryWidget(input: CreateLibraryWidgetInput!): LibraryWidget!
  
  """Update an existing library widget (requires draft or changed status)"""
  updateLibraryWidget(input: UpdateLibraryWidgetInput!): LibraryWidget!
  
  """Publish library widget (draft/changed → published)"""
  publishLibraryWidget(id: ID!): LibraryWidget!
  
  
  """Trash library widget (soft delete, any → trashed)"""
  trashLibraryWidget(id: ID!): LibraryWidget!
  
  """Restore library widget (trashed → previous status)"""
  restoreLibraryWidget(id: ID!): LibraryWidget!
  
  """Revert library widget to a specific history version (published only)"""
  revertLibraryWidget(id: ID!, version: Int!): LibraryWidget!
  
  """Discard changed version and keep published version"""
  discardLibraryWidget(id: ID!): LibraryWidget!

  # ----- Dashboard CRUD + State Machine -----
  
  """Create a new dashboard (status: draft)"""
  createDashboard(input: CreateDashboardInput!): Dashboard!
  
  """Update dashboard info (requires draft or changed status)"""
  updateDashboard(input: UpdateDashboardInput!): Dashboard!
  
  """Publish dashboard (draft/changed → published). Saves to history if previously published."""
  publishDashboard(dashboardId: String!): Dashboard!
  
  """Start editing dashboard (published → changed). Creates draft copies of widgets."""
  changeDashboard(dashboardId: String!): Dashboard!
  
  """Delete dashboard (draft/published/changed → trashed)"""
  deleteDashboard(dashboardId: String!): Dashboard!
  
  """Restore dashboard (trashed → previous status)"""
  restoreDashboard(dashboardId: String!): Dashboard!

  # ----- Dashboard Widget Mutations (requires draft or changed status) -----
  
  """Add a widget to dashboard (copies from LibraryWidget)"""
  addWidgetToDashboard(input: AddWidgetToDashboardInput!): DashboardWidget!
  
  """Update a dashboard widget"""
  updateDashboardWidget(input: UpdateDashboardWidgetInput!): DashboardWidget!
  
  """Remove a dashboard widget"""
  removeDashboardWidget(input: RemoveDashboardWidgetInput!): Boolean!

  # ----- Entity Lock (shared for Dashboard and LibraryWidget) -----
  
  """Lock dashboard for editing (5 min duration). Call periodically to extend."""
  lockDashboard(dashboardId: String!): EntityLock!
  
  """Unlock dashboard"""
  unlockDashboard(dashboardId: String!): Boolean!
  
  """Lock library widget for editing (5 min duration). Call periodically to extend."""
  lockLibraryWidget(id: ID!): EntityLock!
  
  """Unlock library widget"""
  unlockLibraryWidget(id: ID!): Boolean!
}
